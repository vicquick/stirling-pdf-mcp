[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stirling-pdf-mcp"
version = "0.1.0"
description = "MCP server wrapping Stirling-PDF with raw + composite + AEC + cross-MCP tools"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "vicquick" }]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=0.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "uvloop>=0.19.0",
    "tenacity>=8.2.0",
    "aiofiles>=23.2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/vicquick/stirling-pdf-mcp"
"Forked-from" = "https://github.com/gufao/mcp-server-stirling-pdf"
"Stirling-PDF" = "https://github.com/Stirling-Tools/Stirling-PDF"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "C4", "PYI", "SIM", "RET", "ARG", "PTH"]
ignore = ["E501"]  # let formatter handle line length

[tool.setuptools.packages.find]
where = ["src"]
